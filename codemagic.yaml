workflows:
  ios-workflow:
    name: Bedaya iOS

    integrations:
      app_store_connect: medians

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bedaya.medians

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa